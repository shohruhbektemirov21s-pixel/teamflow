# TeamFlow — Nginx: statik fayllar, HTTP (gunicorn) va WebSocket (daphne) proksi.
# TLS (HTTPS) shu oldida — tashqi load balancer yoki shu faylga `listen 443 ssl` bloki (deploy/README.md).
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # Bitta foydalanuvchi ≈ 3 ulanish: WebSocket (mijoz + daphne) va HTTP keep-alive. Har worker uchun chegara;
    # `reuseport` ulanishlarni worker'lar orasida teng taqsimlaydi. (Yuk testida `multi_accept on` bilan
    # hammasini bitta worker olib, 16384 ga yetgach ulanishlarni uzgan edi — deploy/loadtest/README.md.)
    worker_connections 32768;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    server_tokens off;
    keepalive_timeout 30s;
    access_log off;  # yuqori yuklamada disk I/O tejaladi; kerak bo'lsa yoqing

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    upstream web {
        server web:8000;
        keepalive 64;  # gunicorn bilan ulanishlar qayta ishlatiladi
    }
    upstream ws {
        server ws:8001;
    }
    # HTTPS tashqi load balancer'da tugasa, u yuborgan `X-Forwarded-Proto` saqlanadi (aks holda Django
    # https so'rovni http deb o'ylab cheksiz redirect qiladi). Nginx'ning o'zi TLS'ni tugatsa — $scheme.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80 default_server reuseport;
        client_max_body_size 25m;  # UPLOAD_MAX_MB (20) + zaxira

        # Vite build: fayl nomida hash bor — o'zgarmaydi, uzoq keshlanadi
        location /static/assets/ {
            alias /srv/static/assets/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location /static/ {
            alias /srv/static/;
            expires 1h;
        }

        location /ws/ {
            proxy_pass http://ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location ~ ^/(api|admin)/ {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 60s;
            # Javob (fayl yuklab olish ham) Nginx'da buferlanadi — sekin mijoz gunicorn oqimini band qilmaydi
            proxy_buffering on;
        }

        # React ilovasi (SPA): har qanday boshqa manzil — index.html (Django'ga tushmaydi)
        location / {
            root /srv/static;
            try_files /index.html =404;
            add_header Cache-Control "no-cache";
        }
    }
}
