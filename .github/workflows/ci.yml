name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

env:
  DJANGO_DEBUG: "1"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
        working-directory: frontend
      - run: python backend/manage.py migrate --noinput
      - run: python backend/manage.py runserver 127.0.0.1:8020 >/tmp/teamflow-backend.log 2>&1 &
      - run: npm run dev -- --host 127.0.0.1 >/tmp/teamflow-frontend.log 2>&1 &
        working-directory: frontend
      - run: |
          python - <<'PY'
          import time
          import urllib.request

          for url in ("http://127.0.0.1:8020/healthz/live/", "http://127.0.0.1:5173/"):
              for _ in range(60):
                  try:
                      urllib.request.urlopen(url, timeout=1)
                      break
                  except Exception:
                      time.sleep(1)
              else:
                  raise SystemExit(f"Timed out waiting for {url}")
          PY
      - run: python tests/test_e2e.py
      - if: always()
        run: |
          cat /tmp/teamflow-backend.log || true
          cat /tmp/teamflow-frontend.log || true
